name: Health check

# End-to-end read-only check against the live Google Merchant API v1
# (merchantapi.googleapis.com). Auth is the OAuth refresh trio stored as repo
# secrets — no per-run minting. smoke makes NO writes (lists accessible
# accounts). Runs daily + manual dispatch only (never on push/PR), so secrets
# aren't exposed to PRs/forks. The smoke step is skipped entirely while the
# secrets are not configured.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-google-merchants'
    env:
      GOOGLE_MERCHANTS_CLIENT_ID: ${{ secrets.GOOGLE_MERCHANTS_CLIENT_ID }}
      GOOGLE_MERCHANTS_CLIENT_SECRET: ${{ secrets.GOOGLE_MERCHANTS_CLIENT_SECRET }}
      GOOGLE_MERCHANTS_REFRESH_TOKEN: ${{ secrets.GOOGLE_MERCHANTS_REFRESH_TOKEN }}
      GOOGLE_MERCHANTS_ACCOUNT_ID: ${{ secrets.GOOGLE_MERCHANTS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.GOOGLE_MERCHANTS_REFRESH_TOKEN != ''
        run: npm run smoke
      - name: Skipped (no secrets configured)
        if: env.GOOGLE_MERCHANTS_REFRESH_TOKEN == ''
        run: echo "GOOGLE_MERCHANTS_* secrets are not set — live smoke skipped."
